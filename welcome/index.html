<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" type="image/x-icon" href="../images/pkFavicon.png">
        <title>Kaida MC! - Welcome</title>
        <meta name="description" content="Shareable entry point to the Project Kaida website, opening the home page with the navigation menu expanded.">
        <meta name="robots" content="noindex">

        <!-- Shareable landing link (used on CVs, profiles and posts).
             It forwards to the home page with the "?nav=open" flag so a first time
             visitor lands with the navigation menu already expanded. Every other
             page keeps the normal behaviour of loading with the menu closed. -->
        <script>
            window.location.replace("../index.html?nav=open");
        </script>
        <noscript>
            <meta http-equiv="refresh" content="0; url=../index.html?nav=open">
        </noscript>

        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: rgb(20, 20, 20);
                color: rgb(249, 249, 249);
                font-family: sans-serif;
            }

            a {
                color: rgb(40, 184, 93);
            }
        </style>
    </head>
    <body>
        <p>Opening <a href="../index.html?nav=open">Project Kaida</a>&hellip;</p>
    </body>
</html>
